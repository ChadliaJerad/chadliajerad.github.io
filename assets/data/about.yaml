personal:
  name: Chadlia JERAD
  dob: June 11, 1979
  birthplace: Tunis, Tunisia
  nationality: Tunisian

about: >
  I am an Associate Professor at the National School of Computer Science (ENSI),
  University of Manouba, Tunisia, where I teach and conduct research in Embedded
  Systems and Cyber-Physical Systems. I am passionate about building predictable,
  real-time, and formally verifiable systems — from bare-metal embedded platforms
  to distributed cyber-physical infrastructures. I have held research positions at
  UC Berkeley as a Fulbright Visiting Scholar (2016–2017) and as a Visiting Scholar
  (2022–2023), collaborating with Prof. Edward A. Lee on the Lingua Franca and
  Accessors projects.

short_bio: >
  Dr. Chadlia JERAD is an Associate Professor at ENSI, University of Manouba,
  Tunisia, specializing in Embedded Systems, Cyber-Physical Systems, and Real-Time
  Systems. She holds a Doctorate in Electrical Engineering from ENIT (2008) and has
  been a Fulbright Visiting Scholar and a Visiting Scholar at UC Berkeley's EECS
  Department, collaborating with Prof. Edward A. Lee. She leads and co-leads several
  international research initiatives funded by DAAD, serves on program committees of
  top venues (RTAS, RTSS, DATE), and has co-authored publications in IEEE ESL, ACM
  TECS, Proceedings of the IEEE, and IEEE Access.

