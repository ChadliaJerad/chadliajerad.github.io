<!DOCTYPE html>

    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        /* ── Per-tab version toggle ── */
        .tab-header {
            float: right;
            margin-top: 0.2rem;   /* fine-tune vertical alignment with h2 */
        }
        #version-toggle {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }
        .version-btn {
            padding: 0.22rem 0.75rem;
            border: 1.5px solid #1e3c72;
            background: white;
            color: #1e3c72;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .version-btn:hover { background: #e8edf7; }
        .version-btn.active {
            background: #1e3c72;
            color: white;
        }
        /* loading / error */
        .loading { padding: 2rem; color: #888; font-style: italic; }
        .load-error { padding: 2rem; color: #c0392b; }
    </style>
</head>
